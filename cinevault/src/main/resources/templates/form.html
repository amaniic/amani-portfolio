<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CineVault</title><link rel="stylesheet" th:href="@{/style.css}"><script defer th:src="@{/app.js}"></script></head><body>
<header th:replace="~{fragments :: nav}"></header><main><h1 th:text="${movie.id == null ? 'Add a movie' : 'Modify movie'}"></h1><form class="movie-form" method="post" th:action="${movie.id == null ? '/movies' : '/movies/' + movie.id}" th:object="${movie}"><div class="errors" role="alert" th:if="${#fields.hasAnyErrors()}"><p th:each="err : ${#fields.allErrors()}" th:text="${err}"></p></div><div class="grid"><label class="">Title<input type="text" th:field="*{title}" maxlength="200" required></label><label class="">Director<input type="text" th:field="*{director}" maxlength="200" required></label><label class="wide">Plot<textarea rows="5" maxlength="4000" th:field="*{plot}" required></textarea></label><label class="">Rating<select th:field="*{rating}" required><option value="">Choose a rating</option><option th:each="r : ${ {'G','PG','PG-13','R','NC-17','NR'} }" th:value="${r}" th:text="${r}"></option></select></label><label class="">Budget (USD)<input type="number" th:field="*{budget}" min="0" step="0.01" required></label><label class="">Release date<input type="date" th:field="*{releaseDate}" required></label><label class="wide">Poster path (optional)<input type="text" th:field="*{poster}" placeholder="/posters/example.jpg" maxlength="500"></label></div><p class="muted">Optional posters go in src/main/resources/static/posters. Use a path such as /posters/example.jpg.</p><div class="actions"><button th:text="${movie.id == null ? 'Save' : 'Update'}"></button><a class="button secondary" href="/movies">Cancel</a></div></form></main></body></html>
