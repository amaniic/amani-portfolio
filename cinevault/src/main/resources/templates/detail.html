<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CineVault</title><link rel="stylesheet" th:href="@{/style.css}"><script defer th:src="@{/app.js}"></script></head><body>
<header th:replace="~{fragments :: nav}"></header><main><article class="detail"><img class="detail-poster" th:if="${!#strings.isEmpty(movie.poster)}" th:src="${movie.poster}" th:alt="${movie.title + ' poster'}"><div><p class="eyebrow" th:text="${'MOVIE #' + movie.id}"></p><h1 th:text="${movie.title}"></h1><p th:text="${movie.director}"></p><p class="plot" th:text="${movie.plot}"></p><dl><dt>Rating</dt><dd th:text="${movie.rating}"></dd><dt>Budget (USD)</dt><dd th:text="${movie.budget}"></dd><dt>Release date</dt><dd th:text="${movie.releaseDate}"></dd></dl><div class="actions"><a class="button" th:href="@{/movies/{id}/edit(id=${movie.id})}">Modify</a><form method="post" th:action="@{/movies/{id}/delete(id=${movie.id})}" data-confirm="Delete this movie permanently?"><button class="danger">Delete</button></form><a href="/movies">Back to inventory</a></div></div></article></main></body></html>
