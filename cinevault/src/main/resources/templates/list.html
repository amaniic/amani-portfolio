<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CineVault</title><link rel="stylesheet" th:href="@{/style.css}"><script defer th:src="@{/app.js}"></script></head><body>
<header th:replace="~{fragments :: nav}"></header><main><div class="heading"><h1>Movie inventory</h1><a class="button" href="/movies/new">Add a movie</a></div><p class="empty" th:if="${movies.empty}">No movies to show yet. Add your first movie to get started.</p><section class="cards"><article class="card" th:each="movie : ${movies}"><a th:href="@{/movies/{id}(id=${movie.id})}"><img th:if="${!#strings.isEmpty(movie.poster)}" th:src="${movie.poster}" th:alt="${movie.title + ' poster'}"><div class="poster-placeholder" th:if="${#strings.isEmpty(movie.poster)}" aria-hidden="true">CV</div><h2 th:text="${movie.title}"></h2></a><p th:text="${movie.director}"></p><small th:text="${'ID: ' + movie.id}"></small></article></section></main></body></html>
